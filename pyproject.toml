[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-framework-agent"
version = "0.1.0"
description = "Define an agent once (LangGraph-first), deploy it locally, to Gemini Enterprise Agent Platform, or to Claude Managed Agents, and run the same evals against all of them."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "langgraph>=1.0",
  "langchain-core>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.6", "langchain-anthropic>=1.0"]
vertex = [
  "google-cloud-aiplatform[agent_engines]>=2.7",
  "langchain-google-vertexai>=3.0",
]
serving = ["fastapi>=0.115", "uvicorn>=0.34", "a2a-sdk[http-server]>=1.0,<2"]
dev = ["pytest>=8", "httpx>=0.27"]
all = ["multi-framework-agent[anthropic,vertex,serving,dev]"]

[project.scripts]
mfa = "mfa.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["mfa*", "agents*"]

[tool.setuptools.package-data]
# eval datasets, deployment configs and Agent Skills (SKILL.md, references, scripts, assets)
"*" = ["*.yaml", "*.json", "*.md", "*.txt", "skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
